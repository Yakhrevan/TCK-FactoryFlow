name: Android CI
on:
  push:
    branches:
      - feature/factoryflow-bottle-manufacturing
  pull_request:
    branches:
      - main
      - feature/factoryflow-bottle-manufacturing
  workflow_dispatch:
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Build unsigned release APK
        run: gradle assembleRelease
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: factoryflow-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        working-directory: functions
        run: npm install
      - name: Compile trusted backend functions
        working-directory: functions
        run: npm run build
      - name: Run Firestore rules tests in emulator
        run: npx --yes firebase-tools emulators:exec --project factoryflow-rules-test --only firestore "npm --prefix functions test"

  android-instrumentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run Room database instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            set +e
            gradle connectedDebugAndroidTest
            test_exit=$?
            if [ "$test_exit" -ne 0 ]; then
              echo "===== ANDROID LOGCAT: FATAL / CRASH / ROOM ====="
              adb logcat -d -v threadtime | grep -E -i "FATAL EXCEPTION|AndroidRuntime|Process:|CRASH|SQLite|Room|Instrumentation|am_crash|am_anr" | tail -n 300 || true
              echo "===== TEST REPORT FILES ====="
              find app/build/reports/androidTests app/build/outputs/androidTest-results -type f 2>/dev/null | sort || true
            fi
            exit "$test_exit"
      - name: Upload instrumentation reports and crash logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-diagnostics
          path: |
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
